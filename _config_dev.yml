# Opt-in local development overrides
# Use with: bundle exec jekyll serve --config _config.yml,_config_dev.yml
# Or: make -C tools serve-dev

# Local language subset (uncomment your preferred workflow):
# 1. Single language for maximum speed (~4s build):
languages: [en]
gitlab_ci_languages: [en]
default_lang: "en"

# 2. Faster local regeneration:
incremental: true
future: true
livereload: true
