<h3>{{ include.heading }}</h3>

<div>
  <form method="get" class="search-form" action="https://search.f-droid.org/">
    <div class="search-input-wrp">
      <input type="search" class="search-input" name="q">
    </div>
    <input type="hidden" name="lang" value="{{ site.active_lang }}">
    {% comment %} enabled by js/theme.js when the user forced a theme, so search.f-droid.org uses it too {% endcomment %}
    <input type="hidden" name="theme" class="search-theme" value="" disabled>
    <input type="submit" value="{{ include.search }}" class="material-button" />
  </form>
</div>
