<div class="donate-platform-badges">

  <div class="donate-platform-badge bg-white">
    <div class="donate-platform-content">
      <a class="donate-platform-badge-clickpane" href="https://opencollective.com/f-droid/donate"></a>
      <div class="donate-platform-main">
        <div class="donate-platform-title">
          <img class="donate-platform-icon" aria-hidden="true" src="{% asset icons/donate/opencollective.svg %}"/>
          <div class="donate-platform-label">Open Collective</div>
        </div>
        <div class="donate-platform-info">One-time or recurring</div>
        <div class="donate-platform-info">accepts</div>
        <div class="donate-platform-supporticons">
          <img alt="credit card" src="{% asset icons/donate/noto-color-emoji-u1f4b3.svg %}"/>
          <img alt="bank transfer" src="{% asset icons/donate/noto-color-emoji-u1f3e6.svg %}"/>
          <img alt="paypal" src="{% asset icons/donate/PayPal_Logo_Icon_2014.svg %}"/>
        </div>
      </div>
      <div class="donate-platform-aside">
        <div class="donate-platform-preferred">Preferred</div>
        <a class="donate-platform-currency" href="https://opencollective.com/f-droid-euro/donate">EUR</a>
        <a class="donate-platform-currency" href="https://opencollective.com/f-droid/donate">USD</a>
      </div>
    </div>
  </div>

  <div class="donate-platform-badge">
    <div class="donate-platform-content">
      <a class="donate-platform-badge-clickpane" href="https://github.com/sponsors/f-droid"></a>
      <div class="donate-platform-main">
        <div class="donate-platform-title">
          <img class="donate-platform-icon" aria-hidden="true" src="{% asset icons/donate/GitHub_Invertocat_Logo.svg %}"/>
          <div class="donate-platform-label">GitHub</div>
        </div>
        <div class="donate-platform-info">One-time or recurring</div>
        <div class="donate-platform-info">accepts</div>
        <div class="donate-platform-supporticons">
          <img alt="credit card" src="{% asset icons/donate/noto-color-emoji-u1f4b3.svg %}"/>
        </div>
      </div>
    </div>
  </div>

  <div class="donate-platform-badge">
    <div class="donate-platform-content">
      <a class="donate-platform-badge-clickpane" href="https://liberapay.com/F-Droid-Data/donate"></a>
      <div class="donate-platform-main">
        <div class="donate-platform-title">
          <img class="donate-platform-icon" aria-hidden="true" src="{% asset icons/donate/liberapay.svg %}"/>
          <div class="donate-platform-label">Liberapay</div>
        </div>
        <div class="donate-platform-info">Recurring</div>
        <div class="donate-platform-info">accepts</div>
        <div class="donate-platform-supporticons">
          <img alt="credit card" src="{% asset icons/donate/noto-color-emoji-u1f4b3.svg %}"/>
          <img alt="bank transfer" src="{% asset icons/donate/noto-color-emoji-u1f3e6.svg %}"/>
          <img alt="taler transfer" src="{% asset icons/donate/taler.svg %}"/>
          <img alt="paypal" src="{% asset icons/donate/PayPal_Logo_Icon_2014.svg %}"/>
        </div>
      </div>
    </div>
  </div>

  <div class="donate-platform-badge">
    <div class="donate-platform-content">
      <a class="donate-platform-badge-clickpane" href="https://live.blockcypher.com/btc/address/bc1qd8few44yaxc3wv5ceeedhdszl238qkvu50rj4v"></a>
      <div class="donate-platform-main">
        <div class="donate-platform-title">
          <img class="donate-platform-icon" aria-hidden="true" src="{% asset icons/donate/bitcoin.svg %}"/>
          <div class="donate-platform-label">Bitcoin</div>
        </div>
        <div class="donate-platform-info">One-time</div>
        <div class="donate-platform-info">accepts</div>
        <div class="donate-platform-supporticons" title="bitcoin transfer">
          <img alt="bitcoin transfer" class="gs-100" src="{% asset icons/donate/bitcoin.svg %}"/>
        </div>
      </div>
    </div>
  </div>

</div>
