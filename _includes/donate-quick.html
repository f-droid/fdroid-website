{% assign strings = site.data.strings.donate %}

<div class="donate-quick-badges">
  <div class="donate-quick-badge">
    <a href="https://opencollective.com/f-droid/donate?interval=year&amount=12">
	    <div class="donate-quick-title">{{ strings.tier_supporter }}</div>
      <div class="donate-quick-lineitem">
        <span class="donate-quick-big">
          <sup class="donate-quick-big-sup">$</sup>1
        </span>
        <span class="donate-quick-timeframe">
          {{ strings.monthly }}
        </span>
      </div>
    </a>
  </div>
  <div class="donate-quick-badge">
    <a href="https://opencollective.com/f-droid/donate?interval=month&amount=5">
      <div class="donate-quick-title">{{ strings.tier_backer }}</div>
      <div class="donate-quick-lineitem">
        <span class="donate-quick-big">
          <sup class="donate-quick-big-sup">$</sup>5
        </span>
        <span class="donate-quick-timeframe">
          {{ strings.monthly }}
        </span>
      </div>
    </a>
  </div>
  <div class="donate-quick-badge">
    <a href="https://opencollective.com/f-droid/donate?interval=month&amount=100">
      <div class="donate-quick-title">{{ strings.tier_sponsor }}</div>
      <div class="donate-quick-lineitem">
        <span class="donate-quick-big">
          <sup class="donate-quick-big-sup">$</sup>100
        </span>
        <span class="donate-quick-timeframe">
          {{ strings.monthly }}
        </span>
      </div>
    </a>
  </div>
  <div class="donate-quick-badge">
    <a href="https://opencollective.com/f-droid/donate?interval=oneTime&amount=20000">
      <div class="donate-quick-title">{{ strings.tier_large_gift }}</div>
      <div class="donate-quick-lineitem">
        <span class="donate-quick-icon"><img aria-hidden="true" src="{% asset icons/donate/noto-color-emoji-u2764.svg %}" /></span>
        <span class="donate-quick-label">{{ strings.custom_amount }}</span>
      </div>
    </a>
  </div>
</div>
